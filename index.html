<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormatCheck KZ — проверка оформления курсовых и дипломных работ</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#18212b; --muted:#5b6673; --line:#e2e6eb;
  --accent:#0b7a8a; --accent-ink:#fff; --accent-soft:#e3f3f5;
  --ok:#1f8a4c; --ok-soft:#e6f5ec; --err:#c0392b; --err-soft:#fbeceb; --warn:#a86a00; --warn-soft:#fdf3e1;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{background:#10313a;color:#fff;padding:28px 0 30px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:700;letter-spacing:.3px;font-size:15px;opacity:.9}
.brand b{color:#7fd6e0}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}
.lang button.on{background:#fff;color:#10313a;font-weight:600}
h1{font-size:30px;line-height:1.2;margin:0 0 10px;max-width:760px}
header p{margin:0;max-width:720px;color:#c9dde2}
.privacy{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;background:rgba(127,214,224,.14);padding:6px 12px;border-radius:999px;color:#bfe9ee}
main{padding:24px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.drop{border:2px dashed #b9c6cf;border-radius:var(--radius);padding:34px 20px;text-align:center;cursor:pointer;transition:.15s;background:#fafcfd}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:18px;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:9px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#9fb0bc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.muted{color:var(--muted);font-size:14px}
details.settings summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary:after{content:"▾";color:var(--muted)}
details[open].settings summary:after{content:"▴"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px;margin-top:16px}
.grid label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.grid input,.grid select{font:inherit;font-size:15px;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.grid label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.summary{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.big{font-size:44px;font-weight:700;line-height:1}
.big.bad{color:var(--err)} .big.good{color:var(--ok)}
.summary .meta{flex:1;min-width:220px}
.summary .meta div:first-child{font-weight:600;font-size:18px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;max-width:360px}
.bar i{display:block;height:100%;background:var(--ok)}
.check{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:#fff;overflow:hidden}
.check>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.check>summary::-webkit-details-marker{display:none}
.badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.ok .badge{background:var(--ok-soft);color:var(--ok)}
.err .badge{background:var(--err-soft);color:var(--err)}
.warn .badge{background:var(--warn-soft);color:var(--warn)}
.skip .badge{background:#eef0f3;color:var(--muted)}
.check .name{font-weight:600}
.check .short{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.check .body{padding:0 14px 14px 52px}
.item{border-left:3px solid var(--err);padding:6px 10px;margin:8px 0;background:#fcfcfd;border-radius:0 6px 6px 0}
.warn .item{border-left-color:var(--warn)}
.item .d{font-weight:600;font-size:14px}
.item .q{font-size:14px;color:#2b3742}
.item .w{font-size:12.5px;color:var(--muted)}
.tip{font-size:14px;background:var(--accent-soft);padding:8px 12px;border-radius:8px;margin-top:10px}
.tip b{color:var(--accent)}
.more{font-size:13px;color:var(--muted);margin-top:6px}
.err-msg{color:var(--err);font-weight:600;margin-top:12px}
.how ol{margin:8px 0 0;padding-left:20px}
.how li{margin:4px 0}
footer{color:var(--muted);font-size:13px;padding:10px 0 30px}
#report{display:none}
@media print{
  header,.no-print,details.settings,footer{display:none!important}
  body{background:#fff}
  .card{border:0;padding:0}
  .check{break-inside:avoid}
  .check .body{display:block!important}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Format<b>Check</b> KZ</div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="kk">Қазақша</button><button data-lang="ru">Русский</button>
      </div>
    </div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
    <div class="privacy">🔒 <span data-i18n="privacy"></span></div>
  </div>
</header>

<main class="wrap">
  <section class="card no-print">
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong data-i18n="dropTitle"></strong>
      <span data-i18n="dropHint"></span>
    </div>
    <input type="file" id="file" accept=".docx" hidden>
    <div class="row">
      <button class="btn primary" id="demoBtn" data-i18n="demoBtn"></button>
      <button class="btn" id="demoOkBtn" data-i18n="demoOkBtn"></button>
      <a class="btn" id="demoDl" download="demo_kursovaya_s_oshibkami.docx" data-i18n="demoDl"></a>
    </div>
    <div class="err-msg" id="errMsg" hidden></div>
  </section>

  <section class="card no-print">
    <details class="settings" id="settingsBox">
      <summary><span data-i18n="settings"></span></summary>
      <p class="muted" data-i18n="settingsHint"></p>
      <div class="grid">
        <label><span data-i18n="preset"></span>
          <select id="preset">
            <option value="course" data-i18n="presetCourse"></option>
            <option value="diploma" data-i18n="presetDiploma"></option>
            <option value="gost" data-i18n="presetGost"></option>
            <option value="custom" data-i18n="presetCustom"></option>
          </select></label>
        <label><span data-i18n="sFonts"></span><input id="s_fonts"></label>
        <label><span data-i18n="sSize"></span><input id="s_size" type="number" step="0.5" min="8" max="20"></label>
        <label><span data-i18n="sLine"></span><input id="s_line" type="number" step="0.05" min="1" max="3"></label>
        <label><span data-i18n="sIndent"></span><input id="s_indent" type="number" step="0.05" min="0" max="3"></label>
        <label><span data-i18n="sML"></span><input id="s_mL" type="number" step="1" min="0" max="60"></label>
        <label><span data-i18n="sMR"></span><input id="s_mR" type="number" step="1" min="0" max="60"></label>
        <label><span data-i18n="sMT"></span><input id="s_mT" type="number" step="1" min="0" max="60"></label>
        <label><span data-i18n="sMB"></span><input id="s_mB" type="number" step="1" min="0" max="60"></label>
        <label><span data-i18n="sMinSrc"></span><input id="s_minSrc" type="number" step="1" min="0" max="200"></label>
        <label><span data-i18n="sMaxEmpty"></span><input id="s_maxEmpty" type="number" step="1" min="0" max="10"></label>
        <label class="chk"><input id="s_justify" type="checkbox"><span data-i18n="sJustify"></span></label>
        <label class="chk"><input id="s_pagenum" type="checkbox"><span data-i18n="sPagenum"></span></label>
      </div>
      <div class="row">
        <button class="btn" id="shareBtn" data-i18n="share"></button>
        <span class="muted" id="shareMsg"></span>
      </div>
    </details>
  </section>

  <section class="card" id="report" aria-live="polite"></section>

  <section class="card how no-print">
    <strong data-i18n="howTitle"></strong>
    <ol>
      <li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li><li data-i18n="how4"></li>
    </ol>
    <p class="muted" data-i18n="limits"></p>
  </section>
</main>
<footer class="wrap" data-i18n="footer"></footer>

const PRESETS = {
  course: {fonts:"Times New Roman",size:14,line:1.5,indent:1.25,mL:30,mR:10,mT:20,mB:20,justify:true,pagenum:true,minSrc:15,maxEmpty:1},
  diploma:{fonts:"Times New Roman",size:14,line:1.5,indent:1.25,mL:30,mR:10,mT:20,mB:20,justify:true,pagenum:true,minSrc:30,maxEmpty:1},
  gost:   {fonts:"Times New Roman",size:14,line:1.5,indent:1.25,mL:30,mR:15,mT:20,mB:20,justify:true,pagenum:true,minSrc:0,maxEmpty:1}
};
const KEYS = Object.keys(PRESETS.course);
function setForm(cfg){KEYS.forEach(k=>{const e=document.getElementById("s_"+k); if(e.type==="checkbox") e.checked=!!cfg[k]; else e.value=cfg[k];})}
function getCfg(){const c={};KEYS.forEach(k=>{const e=document.getElementById("s_"+k); c[k]= e.type==="checkbox"?e.checked:(k==="fonts"?e.value:parseFloat(String(e.value).replace(",",".")))});return c}
function matchPreset(c){for(const [k,p] of Object.entries(PRESETS)) if(KEYS.every(x=>String(p[x])===String(c[x]))) return k; return "custom"}
function initSettings(){
  let cfg = PRESETS.course;
  try{
    const m = location.hash.match(/cfg=([^&]+)/);
    if(m){ const c = JSON.parse(decodeURIComponent(m[1])); cfg = Object.assign({},PRESETS.course,c); document.getElementById("settingsBox").open = true; }
  }catch(e){}
  setForm(cfg);
  document.getElementById("preset").value = matchPreset(cfg);
  document.getElementById("preset").onchange = e=>{ if(PRESETS[e.target.value]) setForm(PRESETS[e.target.value]); rerun(); };
  KEYS.forEach(k=>document.getElementById("s_"+k).addEventListener("change",()=>{document.getElementById("preset").value=matchPreset(getCfg()); rerun();}));
  document.getElementById("shareBtn").onclick = async ()=>{
    const url = location.href.split("#")[0] + "#cfg=" + encodeURIComponent(JSON.stringify(getCfg()));
    try{ history.replaceState(null,"",url); }catch(e){}
    try{ await navigator.clipboard.writeText(url); document.getElementById("shareMsg").textContent=T("shareOk"); }
    catch(e){ window.prompt("URL:", url); }
  };
}

/* ================= DOCX parsing ================= */
const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const RNS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
function kid(e,name){ if(!e) return null; for(const c of e.children) if(c.localName===name && c.namespaceURI===W) return c; return null }
function kids(e,name){ const r=[]; if(!e) return r; for(const c of e.children) if(c.localName===name && c.namespaceURI===W) r.push(c); return r }
function att(e,name){ if(!e) return null; const v=e.getAttributeNS(W,name); return v!==null&&v!==""?v:(e.getAttribute("w:"+name)) }
function onOff(e){ if(!e) return null; const v=att(e,"val"); return !(v==="0"||v==="false"||v==="off") }
function closestW(e,names){ let p=e.parentElement; while(p){ if(p.namespaceURI===W && names.includes(p.localName)) return p; p=p.parentElement } return null }

function pProps(pPr){
  const o={}; if(!pPr) return o;
  const jc=kid(pPr,"jc"); if(jc){ const v=att(jc,"val"); o.jc = v==="start"?"left":v==="end"?"right":v; }
  const ind=kid(pPr,"ind");
  if(ind){ const h=att(ind,"hanging"), f=att(ind,"firstLine"); if(h!==null) o.firstLine=-parseInt(h,10); else if(f!==null) o.firstLine=parseInt(f,10); }
  const sp=kid(pPr,"spacing");
  if(sp){ const l=att(sp,"line"); if(l!==null){ o.line=parseInt(l,10); o.lineRule=att(sp,"lineRule")||"auto"; } }
  const ol=kid(pPr,"outlineLvl"); if(ol) o.outlineLvl=parseInt(att(ol,"val"),10);
  if(kid(pPr,"numPr")) { const id=kid(kid(pPr,"numPr"),"numId"); o.num = !(id && att(id,"val")==="0"); }
  return o;
}
function rProps(rPr, theme){
  const o={}; if(!rPr) return o;
  const f=kid(rPr,"rFonts");
  if(f){
    const th = att(f,"hAnsiTheme")||att(f,"asciiTheme");
    if(th){ o.font = th.startsWith("major")?theme.major:theme.minor; }
    else { const n = att(f,"hAnsi")||att(f,"ascii"); if(n) o.font=n; }
  }
  const sz=kid(rPr,"sz"); if(sz) o.size=parseInt(att(sz,"val"),10)/2;
  return o;
}

async function parseDocx(buf){
  const zip = await JSZip.loadAsync(buf);
  const dp = new DOMParser();
  const read = async p => { const f=zip.file(p); return f? dp.parseFromString(await f.async("string"),"application/xml"):null };
  const doc = await read("word/document.xml");
  if(!doc) throw new Error("notdocx");
  const stylesX = await read("word/styles.xml");
  const themeX = await read("word/theme/theme1.xml");
  const theme = {major:"Calibri Light", minor:"Calibri"};
  if(themeX){
    const g=(n)=>{const e=themeX.getElementsByTagNameNS("*",n)[0]; const l=e&&[...e.children].find(c=>c.localName==="latin"); return l&&l.getAttribute("typeface")};
    theme.major=g("majorFont")||theme.major; theme.minor=g("minorFont")||theme.minor;
  }
  // styles
  const styles={}; let defP=null, defPPr={}, defRPr={};
  if(stylesX){
    const dd = stylesX.getElementsByTagNameNS(W,"docDefaults")[0];
    if(dd){ const pd=kid(kid(dd,"pPrDefault"),"pPr"), rd=kid(kid(dd,"rPrDefault"),"rPr"); defPPr=pProps(pd); defRPr=rProps(rd,theme); }
    for(const s of stylesX.getElementsByTagNameNS(W,"style")){
      const id=att(s,"styleId"), type=att(s,"type");
      const nm=kid(s,"name"), bo=kid(s,"basedOn");
      styles[id]={id,type,name:(nm?att(nm,"val"):id||"").toLowerCase(),basedOn:bo?att(bo,"val"):null,p:pProps(kid(s,"pPr")),r:rProps(kid(s,"rPr"),theme)};
      if(type==="paragraph" && (att(s,"default")==="1"||att(s,"default")==="true")) defP=id;
    }
  }
  const chain = id => { const out=[]; let g=0; while(id && styles[id] && g++<20){ out.unshift(styles[id]); id=styles[id].basedOn } return out };
  // paragraphs
  const body = doc.getElementsByTagNameNS(W,"body")[0];
  const paras=[];
  for(const p of body.getElementsByTagNameNS(W,"p")){
    if(closestW(p,["txbxContent","footnote","endnote"])) continue;
    const pPr = kid(p,"pPr");
    const ps = kid(pPr,"pStyle"); const sid = ps?att(ps,"val"):defP;
    const ch = chain(sid);
    const st = styles[sid]||{name:""};
    const pp = Object.assign({}, defPPr, ...ch.map(s=>s.p), pProps(pPr));
    const baseR = Object.assign({}, defRPr, ...ch.map(s=>s.r));
    const runs=[]; let text="";
    for(const r of p.getElementsByTagNameNS(W,"r")){
      if(closestW(r,["p"])!==p) continue;
      if(closestW(r,["del"])) continue;
      let t="";
      for(const c of r.children){
        if(c.namespaceURI!==W) continue;
        if(c.localName==="t") t+=c.textContent;
        else if(c.localName==="tab") t+="\t";
        else if(c.localName==="noBreakHyphen") t+="-";
      }
      const rPr=kid(r,"rPr"); const rs=kid(rPr,"rStyle");
      const rch = rs? chain(att(rs,"val")) : [];
      const rp = Object.assign({}, baseR, ...rch.map(s=>s.r), rProps(rPr,theme));
      if(t) runs.push({t, font:rp.font||theme.minor, size:rp.size||10});
      text+=t;
    }
    const brs=[...p.getElementsByTagNameNS(W,"br")].filter(b=>att(b,"type")==="page");
    const hasPageBreak = brs.length>0 || !!kid(pPr,"pageBreakBefore") || !!(pPr && pPr.getElementsByTagNameNS(W,"sectPr").length);
    const hasDrawing = p.getElementsByTagNameNS(W,"drawing").length>0 || p.getElementsByTagNameNS(W,"pict").length>0 || p.getElementsByTagNameNS("*","oMath").length>0;
    const sdt = closestW(p,["sdt"]);
    const inToc = st.name.startsWith("toc") || !!(sdt && /Table of Contents/i.test([...sdt.getElementsByTagNameNS(W,"docPartGallery")].map(e=>att(e,"val")).join(" ")));
    const lvl = pp.outlineLvl;
    const isHeadingStyle = /^heading \d/.test(st.name) || st.name==="title" || (lvl!==undefined && lvl>=0 && lvl<9);
    paras.push({i:paras.length, text, runs, jc:pp.jc||"left", firstLine:pp.firstLine||0, line:pp.line===undefined?240:pp.line, lineRule:pp.lineRule||"auto",
      num:!!pp.num, inTable:!!closestW(p,["tbl"]), inToc, isHeadingStyle, hasDrawing, hasPageBreak, styleName:st.name});
  }
  // sections
  const sects=[...body.getElementsByTagNameNS(W,"sectPr")].map(s=>{
    const m=kid(s,"pgMar"), sz=kid(s,"pgSz");
    const w=sz?+att(sz,"w"):11906, h=sz?+att(sz,"h"):16838;
    const g=k=>m?Math.abs(parseInt(att(m,k)||"0",10)):0;
    return {landscape: (sz&&att(sz,"orient")==="landscape")||w>h, left:g("left"), right:g("right"), top:g("top"), bottom:g("bottom")};
  });
  // page numbers in headers/footers
  let hasPageNum=false;
  for(const name of Object.keys(zip.files)){
    if(!/^word\/(header|footer)\d*\.xml$/.test(name)) continue;
    const x = await zip.file(name).async("string");
    if(/<w:instrText[^>]*>[^<]*\bPAGE\b/.test(x) || /w:instr="[^"]*\bPAGE\b/.test(x) || /docPartGallery w:val="Page Numbers/.test(x)){ hasPageNum=true; break; }
  }
  return {paras, sects, hasPageNum};
}

  intro:["ВВЕДЕНИЕ","КІРІСПЕ"],
  concl:["ЗАКЛЮЧЕНИЕ","ҚОРЫТЫНДЫ"],
  bib:["СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ","СПИСОК ИСПОЛЬЗОВАННОЙ ЛИТЕРАТУРЫ","СПИСОК ЛИТЕРАТУРЫ","СПИСОК ИСТОЧНИКОВ","БИБЛИОГРАФИЧЕСКИЙ СПИСОК","ПАЙДАЛАНЫЛҒАН ӘДЕБИЕТТЕР ТІЗІМІ","ПАЙДАЛАНЫЛҒАН ДЕРЕККӨЗДЕР ТІЗІМІ","ӘДЕБИЕТТЕР ТІЗІМІ","REFERENCES"],
  app:["ПРИЛОЖЕНИЕ","ПРИЛОЖЕНИЯ","ҚОСЫМША","ҚОСЫМШАЛАР"]
};
const norm = s => s.replace(/[ \s]+/g," ").trim().toUpperCase().replace(/^[\d.\s]+/,"").replace(/[.:]$/,"").trim();
function sectionOf(p){
  if(p.inToc || p.inTable) return null;
  const t = p.text.trim(); if(!t || t.length>70 || /\d\s*$/.test(t)) return null;
  const n = norm(t);
  for(const [k,arr] of Object.entries(SEC_PATTERNS)){
    for(const pat of arr){ if(n===pat || (k==="app" && (n.startsWith(pat+" ")||n.startsWith(pat)) && n.length<pat.length+8)) return k; }
  }
  return null;
}
const CAP_START = /^\s*(рисунок|рис\.?|сурет|таблица|табл\.?|кесте)\s*\d/i;
const fmt = (x,d=2) => { const r=Math.round(x*Math.pow(10,d))/Math.pow(10,d); return String(r).replace(".",",") };
const snip = s => { s=s.replace(/\s+/g," ").trim(); return s.length>70? s.slice(0,70)+"…" : s };

function runChecks(doc, cfg){
  const P = doc.paras;
  P.forEach(p=>{ p.sec = sectionOf(p); p.isCap = !p.inTable && !p.inToc && CAP_START.test(p.text) && p.text.trim().length<200; p.isHeading = p.isHeadingStyle || !!p.sec; });
  const findIdx = k => { const p = P.find(p=>p.sec===k); return p? p.i : -1 };
  const idx = {toc:findIdx("toc"), intro:findIdx("intro"), concl:findIdx("concl"), bib:findIdx("bib")};
  const appP = P.find(p=>p.sec==="app" && p.i>Math.max(idx.intro,idx.bib)); const appIdx = appP?appP.i:P.length;
  const start = idx.intro>=0? idx.intro : 0;
  const bodyEnd = idx.bib>start? idx.bib : appIdx;
  const docEnd = appIdx;
  // last heading tracker
  let lastH = ""; P.forEach(p=>{ if(p.isHeading && p.text.trim() && !p.inToc) lastH = p.text.trim(); p.h = lastH; });
  const inBody = p => p.i>=start && p.i<bodyEnd;
  const inDoc = p => p.i>=start && p.i<docEnd;
  const plain = p => !p.inTable && !p.inToc && !p.isHeading && !p.isCap && p.text.trim().length>0;
  const loc = p => ({q:snip(p.text), h:p.h && p.h!==p.text.trim()? snip(p.h) : ""});
  const res = [];
  const add = (id, items, opt={}) => res.push({id, items, status: opt.status || (items.length? (opt.level||"err") : "ok"), note:opt.note, tip:opt.tip});

  // 1 margins
  const mi=[]; const need={left:cfg.mL,right:cfg.mR,top:cfg.mT,bottom:cfg.mB};
  doc.sects.forEach((s,k)=>{ if(s.landscape) return; for(const side of ["left","right","top","bottom"]){ const mm=s[side]/56.6929; if(Math.abs(mm-need[side])>1) mi.push({d:["m_margin",k+1,side,fmt(mm,1),need[side]]}); } });
  add("margins", mi, {tip:"t_margins"});

  // 2 font, 3 size
  const allowed = cfg.fonts.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  const fi=[], si=[];
  P.filter(p=>inDoc(p) && !p.inTable && !p.inToc && p.text.trim()).forEach(p=>{
    const bad=new Set(), badS=new Set();
    p.runs.forEach(r=>{ if(!r.t.trim()) return; if(allowed.length && !allowed.includes(String(r.font).toLowerCase())) bad.add(r.font);
      if(!p.isHeading && !p.isCap && Math.abs(r.size-cfg.size)>0.25) badS.add(fmt(r.size,1)); });
    if(bad.size) fi.push(Object.assign({d:["m_font",[...bad].join(", "),cfg.fonts]},loc(p)));
    if(badS.size) si.push(Object.assign({d:["m_size",[...badS].join(", "),fmt(cfg.size,1)]},loc(p)));
  });
  add("font", fi, {tip:"t_font"}); add("size", si, {tip:"t_font"});

  // 4 spacing, 5 indent, 6 align
  const sp=[], ind=[], al=[];
  P.filter(p=>inDoc(p) && plain(p) && !p.hasDrawing).forEach(p=>{
    if(p.lineRule==="auto"){ const v=p.line/240; if(Math.abs(v-cfg.line)>0.05) sp.push(Object.assign({d:["m_spacing",fmt(v),fmt(cfg.line)]},loc(p))); }
    else sp.push(Object.assign({d:["m_spacingExact",fmt(p.line/20,1),fmt(cfg.line)]},loc(p)));
    if(inBody(p) && !p.num && p.text.trim().length>=40){ const cm=p.firstLine/566.93; if(Math.abs(cm-cfg.indent)>0.05) ind.push(Object.assign({d:["m_indent",fmt(cm),fmt(cfg.indent)]},loc(p))); }
    if(cfg.justify && inBody(p) && p.text.trim().length>=60 && !["both","distribute","justify"].includes(p.jc)) al.push(Object.assign({d:["m_align",p.jc]},loc(p)));
  });
  add("spacing", sp, {tip:"t_par"}); add("indent", ind, {tip:"t_par"});
  add("align", al, {tip:"t_par", status: cfg.justify? undefined : "skip"});

  // 7 page numbers
  add("pagenum", cfg.pagenum && !doc.hasPageNum ? [{d:["m_pagenum"]}] : [], {tip:"t_pagenum", status: cfg.pagenum? undefined:"skip"});

  // 8 sections
  const miss = ["toc","intro","concl","bib"].filter(k=>idx[k]<0).map(k=>({d:["m_section",k]}));
  add("sections", miss, {tip:"t_sections", note: idx.intro<0? "m_noIntro": null});

  // 9 headings
  const hi = P.filter(p=>inDoc(p) && p.isHeading && !p.inToc && /[^.]\.$/.test(p.text.trim())).map(p=>Object.assign({d:["m_hPeriod"]},loc(p)));
  add("headings", hi, {tip:"t_headings"});

  // 10 captions
  const ci=[]; let figCaps=0, figs=0;
  P.filter(p=>inBody(p)).forEach(p=>{
    if(p.hasDrawing && !p.inTable) figs++;
    if(!p.isCap) return;
    const t=p.text.trim();
    if(/^(рисунок|рис|сурет)/i.test(t)) figCaps++;
    if(/^(рис|табл)\.?\s*\d/i.test(t)) ci.push(Object.assign({d:["m_capAbbr"]},loc(p)));
    else if(!/^(рисунок|сурет|таблица|кесте)\s+[\dА-ЯA-Z]+(\.\d+)*\s+[–—-]\s+\S/i.test(t)) ci.push(Object.assign({d:["m_capDash"]},loc(p)));
    if(/[^.]\.$/.test(t)) ci.push(Object.assign({d:["m_capPeriod"]},loc(p)));
  });
  let capLevel;
  if(figs>figCaps){ ci.push({d:["m_capMissing",figs,figCaps]}); if(ci.length===1) capLevel="warn"; }
  add("captions", ci, {tip:"t_captions", level:capLevel});

  // 11 spaces
  const spi=[];
  P.filter(p=>inDoc(p) && !p.inTable && !p.inToc && p.text.trim()).forEach(p=>{
    const t=p.text.replace(/\t/g,"").trim();
    if(/\S {2,}\S/.test(t)) spi.push(Object.assign({d:["m_dbl"]},loc(p)));
    else if(/[^\s] +[,;:!?)]/.test(t) || /[А-Яа-яӘәҒғҚқҢңӨөҰұҮүҺһІіA-Za-z] +\.(\s|$)/.test(t)) spi.push(Object.assign({d:["m_punct"]},loc(p)));
  });
  add("spaces", spi, {tip:"t_spaces"});

  // 12 empty lines
  const ei=[]; let run=0;
  P.filter(p=>inDoc(p) && !p.inTable).forEach(p=>{
    const empty = !p.text.trim() && !p.hasDrawing && !p.hasPageBreak;
    if(empty){ run++; return; }
    if(run>cfg.maxEmpty) ei.push(Object.assign({d:["m_empty",run], before:true},loc(p)));
    run=0;
  });
  add("empty", ei, {tip:"t_empty"});

  // 13 bibliography
  if(idx.bib<0) add("biblio", [], {status:"skip", note:"m_noBib", tip:"t_biblio"});
  else {
    const entries = P.filter(p=>p.i>idx.bib && p.i<appIdx && !p.inTable && !p.isHeading && p.text.trim());
    const bi=[];
    if(entries.length<cfg.minSrc) bi.push({d:["m_few",entries.length,cfg.minSrc]});
    const nonum = entries.filter(p=>!p.num && !/^\s*\[?\d+[.)\]]?\s/.test(p.text)).length;
    if(nonum) bi.push({d:["m_nonum",nonum]});
    add("biblio", bi, {tip:"t_biblio"});
  }
  return res;
}

/* ================= rendering ================= */
let lastResult=null, lastBuf=null, lastName="";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function msg(d){
  const [k,...a]=d; const L=I18N[LANG];
  if(k==="m_margin") return L.m_margin(a[0], L.sides[a[1]], a[2], a[3]);
  if(k==="m_section") return L.m_section(L.secNames[a[0]]);
  const v=L[k]; return typeof v==="function"? v(...a) : v;
}
function renderReport(r){
  const L=I18N[LANG], box=document.getElementById("report");
  const counted = r.checks.filter(c=>c.status!=="skip");
  const passed = counted.filter(c=>c.status==="ok").length;
  const issues = r.checks.reduce((s,c)=>s+(c.status==="err"||c.status==="warn"?c.items.length:0),0);
  let h = `<h2 style="margin:0 0 14px;font-size:22px">${esc(L.repTitle)}</h2>
  <div class="summary"><div class="big ${issues?"bad":"good"}">${issues}</div>
  <div class="meta"><div>${issues? esc(L.issues(issues)) : esc(L.allGood)}</div>
  <div class="muted">${esc(L.passed(passed,counted.length))} · ${esc(L.file)}: ${esc(r.name)} · ${esc(L.time(r.ms))}</div>
  <div class="bar"><i style="width:${Math.round(passed/counted.length*100)}%"></i></div></div>
  <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="window.print()">${esc(L.print)}</button>
  <button class="btn" onclick="document.getElementById('file').click()">${esc(L.again)}</button></div></div>`;
  const order={err:0,warn:1,skip:2,ok:3};
  [...r.checks].sort((a,b)=>order[a.status]-order[b.status]).forEach(c=>{
    const sym = {ok:"✓",err:"!",warn:"?",skip:"–"}[c.status];
    const short = c.status==="ok"? "" : c.status==="skip"? esc(c.note?msg([c.note]):L.skipped) : esc(c.items.length);
    h += `<details class="check ${c.status}" ${c.status==="err"||c.status==="warn"?"open":""}><summary><span class="badge">${sym}</span><span class="name">${esc(L["c_"+c.id])}</span><span class="short">${short}</span></summary>`;
    if(c.items.length || c.note){
      h += `<div class="body">`;
      if(c.note && c.status!=="skip") h += `<div class="muted">${esc(msg([c.note]))}</div>`;
      const MAX=15;
      c.items.slice(0,MAX).forEach(it=>{
        h += `<div class="item"><div class="d">${esc(msg(it.d))}</div>`;
        if(it.q) h += `<div class="q">${it.before?esc(L.beforePara)+": ":""}«${esc(it.q)}»</div>`;
        if(it.h) h += `<div class="w">${esc(L.inSection(it.h))}</div>`;
        h += `</div>`;
      });
      if(c.items.length>MAX) h += `<div class="more">${esc(L.more(c.items.length-MAX))}</div>`;
      if(c.items.length && c.tip) h += `<div class="tip"><b>${esc(L.tipLabel)}</b> ${esc(L[c.tip])}</div>`;
      h += `</div>`;
    }
    h += `</details>`;
  });
  box.innerHTML = h; box.style.display="block";
}
function b64ToBuf(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer }
async function check(buf, name){
  const err=document.getElementById("errMsg"); err.hidden=true;
  lastBuf=buf; lastName=name;
  try{
    const t0=performance.now();
    const doc=await parseDocx(buf);
    const checks=runChecks(doc,getCfg());
    lastResult={name, checks, ms:Math.max(1,Math.round(performance.now()-t0))};
    renderReport(lastResult);
    document.getElementById("report").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){ console.error(e); err.textContent=T("errNotDocx"); err.hidden=false; }
}
function rerun(){ if(lastBuf) check(lastBuf,lastName) }

/* ================= wiring ================= */
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang; try{localStorage.setItem("fc_lang",LANG)}catch(e){} applyI18n()});
const drop=document.getElementById("drop"), fileIn=document.getElementById("file");
drop.onclick=()=>fileIn.click();
drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileIn.click(); } };
fileIn.onchange=async()=>{ const f=fileIn.files[0]; if(f) check(await f.arrayBuffer(), f.name); fileIn.value=""; };
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",async e=>{ const f=e.dataTransfer.files[0]; if(f) check(await f.arrayBuffer(), f.name); });
document.getElementById("demoBtn").onclick=()=>check(b64ToBuf(DEMO_ERR_B64),"demo_kursovaya_s_oshibkami.docx");
document.getElementById("demoOkBtn").onclick=()=>check(b64ToBuf(DEMO_OK_B64),"demo_kursovaya_bez_oshibok.docx");
document.getElementById("demoDl").href="data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,"+DEMO_ERR_B64;
initSettings(); applyI18n();
</script>
</body>
